name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, build, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Build first: several suites (e.g. test:admin) import workspace packages through their dist/ exports.
      - name: Production build (all workspaces)
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Tests (shared, edge, API e2e, web, admin)
        run: npm test
      - name: Postgres row-level store suite
        run: npm run test:postgres
        env:
          PORTAL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  portal-api-docker:
    name: Portal API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile.portal
        run: docker build -f Dockerfile.portal -t lifeos-portal-api:ci .
      - name: Production boot smoke test
        run: bash scripts/ci/portal-api-docker-smoke.sh lifeos-portal-api:ci
        env:
          SMOKE_NETWORK: host
          SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
