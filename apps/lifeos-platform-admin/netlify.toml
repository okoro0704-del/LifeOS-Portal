# Dedicated Netlify site for admin.getlifeos.app if not proxied from the guest site.
[build]
  command = "npm --workspace @lifeos-portal/platform-admin run build"
  publish = "apps/lifeos-platform-admin/dist"

[build.environment]
  VITE_ENABLE_TRUST_ID = "false"
  VITE_BYPASS_AUTH_FOR_TESTING = "false"
  VITE_DEFAULT_USER_ROLE = "ADMIN"
  # Same-origin API (proxied below) so the HttpOnly session cookie is first-party.
  VITE_PORTAL_API = "/api"
  VITE_TRUSTID_MODE = "mock"

[[redirects]]
  from = "/api/*"
  to = "https://gateway-production-c3f9.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
