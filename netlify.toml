# Guest portal on getlifeos.app (this site).
# admin.getlifeos.app → platform-admin Railway (PLATFORM ADMIN DASHBOARD).
# business.getlifeos.app → business-portal Railway (PLATFORM USER DASHBOARD web app).
# {brand}.getlifeos.app for mybrandOS is proxied first-party via edge function.
[build]
  command = "npm --workspace @lifeos-portal/web run build"
  publish = "apps/portal-web/dist"

[build.environment]
  VITE_ENABLE_TRUST_ID = "false"
  VITE_BYPASS_AUTH_FOR_TESTING = "true"
  VITE_DEFAULT_USER_ROLE = "USER"
  NEXT_PUBLIC_DEFAULT_USER_ROLE = "USER"
  VITE_PORTAL_API = "https://gateway-production-c3f9.up.railway.app"
  VITE_TRUSTID_MODE = "mock"
  GATEWAY_URL = "https://gateway-production-c3f9.up.railway.app"
  MYBRANDOS_URL = "https://mybrandos-production.up.railway.app"

# Run before SPA fallback so mybrand tenants never load the Portal shell.
[[edge_functions]]
  function = "mybrand-proxy"
  path = "/*"

# Host-specific proxies must come before the SPA fallback.
[[redirects]]
  from = "https://admin.getlifeos.app/*"
  to = "https://platform-admin-production-26aa.up.railway.app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://business.getlifeos.app/*"
  to = "https://business-portal-production-c734.up.railway.app/:splat"
  status = 200
  force = true

# Apex-only /admin → platform admin (NOT brand subdomains).
[[redirects]]
  from = "https://getlifeos.app/admin"
  to = "https://admin.getlifeos.app/admin/tenants"
  status = 302
  force = true

[[redirects]]
  from = "https://getlifeos.app/admin/*"
  to = "https://admin.getlifeos.app/admin/:splat"
  status = 302
  force = true

[[redirects]]
  from = "https://www.getlifeos.app/admin"
  to = "https://admin.getlifeos.app/admin/tenants"
  status = 302
  force = true

[[redirects]]
  from = "https://www.getlifeos.app/admin/*"
  to = "https://admin.getlifeos.app/admin/:splat"
  status = 302
  force = true

# React Router SPA fallback for the guest portal (hotels + apex).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
